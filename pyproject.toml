[project]
name = "lora-eval-lab"
version = "0.1.0"
description = "LoRA fine-tune of a small open-weight model on clinical note generation, evaluated blind against its base"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26", "datasets>=2.19", "transformers>=4.44", "peft>=0.12"]
[project.optional-dependencies]
dev = ["pytest>=7", "matplotlib>=3.8", "ruff>=0.5"]
judge = ["google-genai>=1.0"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# Lint only. The house call-expansion style is not what a formatter produces.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
